[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "module_vc"
version = "0.0.1"
description = "Projeto de introdu\u00e7\u00e3o a vis\u00e3o computacional com um classificador de imagens"
authors = [
  { name = "Th1agoChaves" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "ipython",
    "jupyterlab",
    "keras>=3.15.1",
    "loguru",
    "matplotlib",
    "mkdocs",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "tensorflow>=2.21.0",
    "tqdm",
    "typer",
]
requires-python = "==3.13.2"


[tool.ruff]
line-length = 99
src = ["module_vc"]
include = ["pyproject.toml", "module_vc/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["module_vc"]
force-sort-within-sections = true

